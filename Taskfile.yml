# Porta de entrada única da base: `task` lista tudo, `task <nome>` roda.
# As tarefas chamam os scripts que já existem (pnpm, node, docker compose); regra e motivo no README.
version: '3'

vars:
  PACOTES: erp-contratos erp-nucleo erp-moldura            # ordem de publicação (AMBIENTE.md §1)
  APPS: erp-shell erp-zona-1 erp-zona-2 erp-zona-acesso
  REPOS: erp-contratos erp-nucleo erp-moldura erp-dominio-stub erp-shell erp-zona-1 erp-zona-2 erp-zona-acesso
  SHOWCASE: docker compose -f base/showcase/docker-compose.yml

tasks:
  default:
    desc: Lista as tarefas
    silent: true
    cmd: task --list

  # --- preparar a máquina -------------------------------------------------------------------
  submodulos:
    desc: Busca os 8 repositórios (submódulos)
    cmd: git submodule update --init

  hooks:
    desc: Ativa o pre-push que recusa submódulo não enviado e núcleo fora de lockstep
    cmd: git config core.hooksPath .githooks

  registry:subir:
    desc: Sobe o Verdaccio (registro local de pacotes, porta 4873)
    cmd: node base/scripts/registry.mjs up

  registry:descer:
    desc: Derruba o Verdaccio (os pacotes publicados ficam no volume)
    cmd: node base/scripts/registry.mjs down

  pacotes:publicar:
    desc: "Publica contratos, núcleo e moldura no Verdaccio — só num Verdaccio vazio ou com versão nova (ADR-0010)"
    cmds:
      - for: { var: PACOTES, split: ' ' }
        cmd: cd repos/{{.ITEM}} && pnpm install && pnpm publicar

  instalar:
    desc: Instala as dependências das apps e do stub (os pacotes já têm de estar no Verdaccio)
    cmds:
      - for: [erp-shell, erp-zona-1, erp-zona-2, erp-zona-acesso, erp-dominio-stub]
        cmd: cd repos/{{.ITEM}} && pnpm install

  preparar:
    desc: "Máquina nova: submódulos, hooks, Verdaccio, publicação e instalação, nesta ordem"
    cmds:
      - task: submodulos
      - task: hooks
      - task: registry:subir
      - task: pacotes:publicar
      - task: instalar

  # --- rodar -------------------------------------------------------------------------------
  base:
    desc: Sobe domínios, shell e zonas em http://localhost:3000 (Ctrl-C derruba)
    cmd: node base/scripts/subir-base.mjs

  base:construir:
    desc: Igual a `base`, refazendo os builds das apps
    cmd: node base/scripts/subir-base.mjs --construir

  # --- testar ------------------------------------------------------------------------------
  test:
    desc: Testes de unidade dos 8 repositórios
    cmds:
      - for: { var: REPOS, split: ' ' }
        cmd: 'if node -e "process.exit(require(\"./repos/{{.ITEM}}/package.json\").scripts?.test ? 0 : 1)"; then echo "== {{.ITEM}}" && (cd repos/{{.ITEM}} && pnpm test); fi'

  typecheck:
    desc: Checagem de tipos das 4 apps
    cmds:
      - for: { var: APPS, split: ' ' }
        cmd: echo "== {{.ITEM}}" && cd repos/{{.ITEM}} && pnpm typecheck

  verificar:
    desc: Ponta a ponta — sobe tudo, verifica e derruba (usa os builds existentes)
    cmd: node --test base/verificacao/*.test.mjs

  verificar:construir:
    desc: Ponta a ponta reconstruindo as apps com fonte mais novo que o build (CONSTRUIR=tudo força todas)
    cmd: node --test base/verificacao/*.test.mjs
    env:
      CONSTRUIR: '{{.CONSTRUIR | default "1"}}'

  verificar:redis:
    desc: Ponta a ponta com a sessão no Redis do showcase (task showcase:subir antes)
    cmd: node --test base/verificacao/*.test.mjs
    env:
      REDIS_URL: redis://127.0.0.1:6379
      # zonas com o usuário ACL só de leitura (docker-compose do showcase)
      REDIS_URL_ZONA: redis://zona:dev-zona-leitura@127.0.0.1:6379
      CONSTRUIR: '{{.CONSTRUIR | default "1"}}'

  scripts:test:
    desc: Testes dos scripts da base (ambiente, lockstep, hashes)
    cmd: node --test base/scripts/*.test.mjs

  verificar:estatica:
    desc: Verificações estáticas de segurança e rede (saída de rede, server-only, DTOs, links)
    cmd: node --test base/verificacao/saida-de-rede.test.mjs base/verificacao/seguranca-estatica.test.mjs

  # --- enviar ------------------------------------------------------------------------------
  pacotes:alinhar-hashes:
    desc: "Troca os hashes @erp/* dos lockfiles pelos do Verdaccio desta máquina (só com o mesmo commit de origem; não commitar)"
    cmd: node base/scripts/alinhar-hashes.mjs

  lockstep:
    desc: Confere que as 4 apps usam a mesma versão exata do @erp/nucleo
    cmd: node base/scripts/verificar-lockstep.mjs

  checar-envio:
    desc: Confere que todo commit de submódulo fixado já está num branch remoto
    cmd: node base/scripts/checar-envio.mjs

  # --- showcase ----------------------------------------------------------------------------
  showcase:
    desc: "Sobe TUDO: Redis, Keycloak, domínios com dados gravados, shell e zonas em http://localhost:3000 (Ctrl-C derruba)"
    cmd: node base/showcase/subir.mjs {{.CLI_ARGS}}

  showcase:conferir:
    desc: Com o showcase no ar, mostra o que cada ator vê em cada zona e confere infraestrutura e segurança visível
    cmd: node base/showcase/conferir.mjs

  showcase:subir:
    desc: Sobe só Redis e Keycloak do showcase (tempos de sessão em docs/CONFIGURACAO.md)
    cmd: '{{.SHOWCASE}} up -d'

  showcase:descer:
    desc: Derruba Redis e Keycloak do showcase (o volume do Redis fica)
    cmd: '{{.SHOWCASE}} down'

  showcase:checar:
    desc: "Confere o SSO: PKCE, fluxos proibidos, redirect exato, audiência, rotação de refresh, força bruta, realm endurecido"
    cmd: node base/showcase/checar-keycloak.mjs

  showcase:recriar-keycloak:
    desc: Recria o Keycloak para reimportar o realm depois de mudar configuração
    cmd: '{{.SHOWCASE}} up -d --force-recreate keycloak'

  showcase:dados:resetar:
    desc: Volta os domínios falsos do showcase à semente (apaga repos/erp-dominio-stub/dados/estado)
    dir: repos/erp-dominio-stub
    cmd: pnpm resetar

  acesso-v2:
    desc: Sobe só o mock da gestão de acesso v2 (porta 4020; dados gravados em repos/erp-dominio-stub/dados/estado)
    dir: repos/erp-dominio-stub
    cmd: node src/servidor.mjs gestao-acesso-v2
    env:
      DADOS_DIR: dados/estado
