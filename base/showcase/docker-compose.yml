# Showcase: infraestrutura que a base usa fora do processo das apps.
# Conferido em 2026-09-22 (checar-keycloak.mjs); entra em uso em D1 (Redis) e D2 (Keycloak).
# Só para desenvolvimento: os padrões de senha e segredo abaixo são públicos de propósito;
# fora da máquina local, defina-os no ambiente (docs/CONFIGURACAO.md §1).
name: erp-showcase

services:
  redis:
    image: redis:7.4-alpine
    # ADR-0002: instância só de sessão, sem despejo de chave e com AOF.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dados:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USUARIO:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_SENHA:-admin}
      # Segredo do cliente confidencial erp-shell; o shell usa o mesmo valor (docs/CONFIGURACAO.md)
      IDP_CLIENTE_SEGREDO: ${IDP_CLIENTE_SEGREDO:-dev-erp-shell-segredo}
      # Tempos de sessão vêm do ambiente (padrões e significado em docs/CONFIGURACAO.md);
      # o realm os lê por placeholder no import.
      ERP_TOKEN_VIDA_S: ${ERP_TOKEN_VIDA_S:-300}
      ERP_SESSAO_INATIVIDADE_S: ${ERP_SESSAO_INATIVIDADE_S:-1800}
      ERP_SESSAO_MAXIMA_S: ${ERP_SESSAO_MAXIMA_S:-36000}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-erp.json:/opt/keycloak/data/import/realm-erp.json:ro

volumes:
  redis_dados:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
